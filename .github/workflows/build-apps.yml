# Builds the SHERZ apps in the cloud, so no Mac / Windows PC / Android Studio is needed on your side.
# Run it:  GitHub → Actions → "Build apps" → Run workflow.   Downloads appear at the bottom of the run page (Artifacts).
# Optional: Settings → Secrets and variables → Actions → Variables → SHERZ_API_URL = your backend URL (default: https://sherz-ai.onrender.com)
name: Build apps
on:
  workflow_dispatch: {}
  push:
    tags: [ 'app-v*' ]
env:
  SHERZ_API_URL: ${{ vars.SHERZ_API_URL || 'https://sherz-ai.onrender.com' }}
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix: { os: [ windows-latest, macos-latest ] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix apps/desktop
      - run: node apps/scripts/sync-web.mjs
      - run: npx electron-builder --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'      # unsigned builds; add signing secrets later (see apps/README.md)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --prefix apps/mobile
      - run: node apps/scripts/sync-web.mjs
      - run: node scripts/init.mjs
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
  ios:
    # Proves the iPhone app compiles. A real .ipa for TestFlight / the App Store needs your Apple Developer certificate — see apps/README.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix apps/mobile
      - run: node apps/scripts/sync-web.mjs
      - run: node scripts/init.mjs
        working-directory: apps/mobile
      - run: xcodebuild -workspace App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ../build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile/ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: apps/mobile/build/Build/Products/Debug-iphonesimulator/App.app
