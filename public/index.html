<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SHERZ</title>
  <link rel="icon" href="/sherz-icon.svg" type="image/svg+xml">
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

     :root{
      color-scheme: dark;

      --bg:#070708;
      --panel: rgba(255,255,255,0.04);
      --panel-2: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.10);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.55);
      --shadow: 0 20px 60px rgba(0,0,0,0.55);
      --radius: 18px;
      --ring: rgba(255,255,255,0.14);

      --dot-idle: rgba(255,255,255,0.55);
      --dot-listen: rgba(74,222,128,.85);
      --dot-think: rgba(59,130,246,.85);
      --dot-respond: rgba(167,139,250,.85);

      --dot-listen-phase: rgba(74,222,128,.85);
      --dot-cause: rgba(59,130,246,.85);

      /* ✅ SHERZ AI brand aura palette — tweak these to retune the
         speaking-state glow without touching any JS/canvas code */
      --sherz-aura-1: #0B3D91;  /* Deep Cyber Blue */
      --sherz-aura-2: #00E5FF;  /* Neon Cyan */
      --sherz-aura-3: #7C3AED;  /* Electric Violet */
      --dot-analyze: rgba(167,139,250,.85);
      --dot-help: rgba(250,204,21,.85);
      --dot-comfort: rgba(244,114,182,.85);

      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --kb-offset:   0px;
    }

    *{ box-sizing:border-box }
    html,body{ height:100%; max-width:100vw; overflow-x:hidden; }
    body{
      margin:0;
      background:
        radial-gradient(800px 500px at 50% 20%, rgba(255,255,255,0.06), transparent 60%),
        radial-gradient(600px 400px at 20% 80%, rgba(255,255,255,0.05), transparent 60%),
        radial-gradient(600px 400px at 80% 85%, rgba(255,255,255,0.05), transparent 60%),
        var(--bg);
      color:var(--text);
      font:14px/1.45 system-ui, Segoe UI, Roboto, Arial;
      overflow-x:hidden;
    }

    /* --- Layout --- */
    .app{
      height:100dvh;
      max-width:100vw;
      overflow-x:hidden;
      display:grid;
      grid-template-rows: auto 1fr auto;
    }

    /* iOS visualViewport JS sets these inline when keyboard opens */
    html.platform-android .composer-shell,
    html.platform-android .voice-bar{
      transform: translateY(calc(-1 * var(--kb-offset)));
      transition: transform .15s ease-out;
    }

    /* --- Topbar --- */
    .topbar{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: linear-gradient(180deg, rgba(7,7,8,0.88), rgba(7,7,8,0.52));
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-top: var(--safe-top);
    }
    .topbar-inner{
      max-width: 860px;
      margin: 0 auto;
      padding: 14px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:0px;
      font-weight:700;
      letter-spacing:.18em;
      opacity:.95;
      user-select:none;
    }
    .brand-badge{
      width:56px;
      height:56px;
      object-fit:contain;
      display:block;
    }

    .top-actions{ display:flex; align-items:center; gap:10px; }

    .status-pill{
      height:30px; padding: 0 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      display:flex; align-items:center; gap:8px;
      font-size:12px;
      color: rgba(255,255,255,0.72);
      user-select:none;
    }

    /* --- PRESENCE DOT --- */
    .status-dot{
      width:8px;height:8px;border-radius:999px;
      background: var(--dot-idle);
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.06),
        0 10px 30px rgba(0,0,0,0.25);
      opacity:.75;
    }

    /* idle = breathe */
    .status-dot.idle{
      animation: breathe 3.8s ease-in-out infinite;
    }

    /* sukutdagi yanada yumshoq breathe */
    .status-dot.idle.soft{
      animation: breatheSoft 5.8s ease-in-out infinite;
      opacity: .45;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
    }

    /* listening = pulse fast */
    .status-dot.listening{
      background: var(--dot-listen);
      animation: pulse 1.35s ease-in-out infinite;
      box-shadow:
        0 0 0 3px rgba(74,222,128,0.10),
        0 0 18px rgba(74,222,128,0.18);
    }

    /* thinking = pulse slow */
    .status-dot.thinking{
      background: var(--dot-think);
      animation: pulse 2.6s ease-in-out infinite;
      box-shadow:
        0 0 0 3px rgba(59,130,246,0.10),
        0 0 18px rgba(59,130,246,0.18);
    }

    /* transcribing = STT round-trip in progress — brand cyan, faster pulse than thinking */
    .status-dot.transcribing{
      background: var(--sherz-aura-2, #00E5FF);
      animation: pulse 1.3s ease-in-out infinite;
      box-shadow:
        0 0 0 3px rgba(0,229,255,0.12),
        0 0 18px rgba(0,229,255,0.22);
    }

    /* responding = pulse snappy */
    .status-dot.responding{
      background: var(--dot-respond);
      animation: pulse 0.95s ease-in-out infinite;
      box-shadow:
        0 0 0 3px rgba(167,139,250,0.10),
        0 0 18px rgba(167,139,250,0.18);
    }

    /* speaking = SHERZ brand cyan pulse, matches the aura */
    .status-dot.speaking{
      background: var(--sherz-aura-2);
      animation: pulse 0.95s ease-in-out infinite;
      box-shadow:
        0 0 0 3px rgba(0,229,255,0.12),
        0 0 18px rgba(0,229,255,0.22);
    }

    @keyframes breathe{
      0%,100%{ transform: scale(1); opacity:.55; }
      50%{ transform: scale(1.22); opacity:.9; }
    }
    @keyframes breatheSoft{
      0%,100%{ transform: scale(1); opacity:.35; }
      50%{ transform: scale(1.14); opacity:.6; }
    }
    @keyframes pulse{
      0%{ transform: scale(1); opacity:.75; }
      50%{ transform: scale(1.35); opacity:1; }
      100%{ transform: scale(1); opacity:.75; }
    }

    .btn{
      height:30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.85);
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,0.06); }

    /* === NEW: Desktop Side Panels Shell === */
    .shell{
      width:100%;
      max-width: 1600px;
      margin: 0 auto;

      display:grid;
      grid-template-columns: 340px minmax(0, 860px) 340px;
      gap: 18px;
      padding: 18px 14px; /* was 18px 14px 120px — that 120px was clearance for the
                              old floating composer; it's an in-flow row now, so this
                              padding was just stealing height from the feed */
      height: 100%;      /* ✅ fill the .app 1fr row instead of growing with content */
      min-height: 0;     /* ✅ prevents grid blowout so children can scroll internally */
    }
    
/* ✅ Grid placement fix (panel yo‘qolsa ham center joyidan siljimaydi) */
#leftPanel { grid-column: 1; }
.center-col { grid-column: 2; }
#brainPanel { grid-column: 3; }

    .center-col{
      min-width:0;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;      /* ✅ lets .feed be the thing that scrolls, not the whole page */
    }

    .side{
      position: sticky;
      top: 86px; /* topbar osti */
      align-self: start;
      height: calc(100dvh - 86px - 140px); /* composer uchun joy */
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(0,0,0,0.40);
      overflow: hidden;
      display:none; /* default yopiq */
    }

    .side.open{ display:block; }

    .side .inner{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      height: 100%;
      overflow:auto;
    }

    .side h3{
      margin: 6px 0 0;
      font-size: 11px;
      letter-spacing: .7px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      user-select:none;
    }

    .side .card{
      border:1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 10px 10px;
      background: rgba(255,255,255,0.04);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .side .card span{ color: rgba(255,255,255,0.65); font-size: 12.5px; }
    .side .card b{ font-size: 13.5px; }

    .side .navbtn{
      width:100%;
      text-align:left;
      border:1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 10px 10px;
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.88);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .side .navbtn:hover{ background: rgba(255,255,255,0.06); }
    .side .navbtn i{ opacity:.55; font-style:normal; }

    .side .small{
      font-size: 12px;
      color: rgba(255,255,255,0.58);
      line-height: 1.5;
    }

    /* Desktop toggles button - topbar ichida */
    .btn-ghost{
      height:30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.85);
      cursor:pointer;
      user-select:none;
      display:none; /* faqat desktop */
    }
    .btn-ghost:hover{ background: rgba(255,255,255,0.06); }
    .btn-ghost .muted{ opacity:.65; }

    /* --- Chat area --- */
    .feed{
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      /* padding endi shell’da berilyapti */
      padding: 0;
      display:flex;
      flex-direction:column;
      gap:14px;
      flex: 1;                 /* ✅ takes remaining height under the orb */
      min-height: 0;           /* ✅ required for overflow to actually kick in inside flex */
      overflow-y: auto;        /* ✅ THE fix — messages scroll here, not the whole page */
      -webkit-overflow-scrolling: touch;
    }

    /* Bubble container */
    .bubble{
      width: fit-content;
      max-width: 640px;
      height: auto;
      overflow: visible;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 16px 16px 12px;
      position: relative;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .bubble.me{
      margin-left:auto;
      background: rgba(255,255,255,0.065);
      border-color: rgba(255,255,255,0.14);
    }

    .bubble.ai{
      margin-right:auto;
      background: rgba(255,255,255,0.032);
      border-color: rgba(255,255,255,0.10);
    }

    /* ✅ FIX: AI typewriter paytida bubble chapdan "grow" bo‘lmasin */
    .bubble.ai.stable{
      width: min(640px, 92vw);
    }

    .time{
      display:block;
      margin-top:10px;
      font-size:11px;
      color: rgba(255,255,255,0.48);
      user-select:none;
    }

    .bubble b{font-weight:700}
    .bubble i{opacity:.95}
    .bubble code{background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.10); border-radius:10px; padding:2px 6px}
    .bubble pre{background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.10); border-radius:14px; padding:12px; overflow:auto}

    /* suggestion chips inside ai bubble (intro) */
    .suggest{
      margin-top: 10px;
      display:flex;
      gap:8px;
      flex-wrap: wrap;
    }
    .chip{
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      padding:6px 10px;
      border-radius: 999px;
      color: rgba(255,255,255,0.70);
      font-size: 12px;
      cursor: pointer;
      user-select:none;
    }
    .chip:hover{ background: rgba(255,255,255,0.06); }

    /* ===== Phase blocks ===== */
    .phase-wrap{ display:flex; flex-direction:column; gap:12px; width:100%; }
    .phase{
      width:100%;
      border:1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 14px 14px 12px;

      opacity: 0;
      transform: translateY(6px);
      transition: opacity .22s ease, transform .22s ease;
    }
    .phase.enter{ opacity: 1; transform: translateY(0); }

    .phase-h{
      display:flex; align-items:center; gap:10px;
      margin-bottom: 10px;
      font-size: 11px;
      letter-spacing: .7px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.52);
      user-select:none;
    }
    .phase-dot{
      width:8px;height:8px;border-radius:999px;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.35);
    }
    .phase.listen  .phase-dot{ background: var(--dot-listen-phase); }
    .phase.cause   .phase-dot{ background: var(--dot-cause); }
    .phase.analyze .phase-dot{ background: var(--dot-analyze); }
    .phase.help    .phase-dot{ background: var(--dot-help); }
    .phase.comfort .phase-dot{ background: var(--dot-comfort); }

    .phase-b{ color: rgba(255,255,255,0.90); min-height: 18px; }

    /* Typing dots */
    .dots{display:inline-flex;gap:6px;vertical-align:middle}
    .dot{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,0.55);opacity:.35;animation:b 1.1s infinite}
    .dot:nth-child(2){animation-delay:.2s}
    .dot:nth-child(3){animation-delay:.4s}
    @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:.95}}

    /* --- Bottom composer --- */
    .composer-shell{
      position:sticky;
      bottom:0;
      z-index: 20;
      padding: 14px 12px 18px;
      background: linear-gradient(180deg, transparent, rgba(7,7,8,0.80) 18%, rgba(7,7,8,0.92));
      backdrop-filter: blur(10px);
      max-height: 260px;
      overflow: hidden;
      transition: max-height .35s ease, opacity .3s ease, transform .3s ease, padding .35s ease;
    }
    /* ✅ Hidden by default — text chat is opt-in via the keyboard toggle */
    .composer-shell.collapsed{
      max-height: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      padding-top: 0;
      padding-bottom: 0;
      pointer-events: none;
    }

    /* ✅ Voice-first bottom bar — prominent mic + small keyboard toggle */
    .voice-bar{
      position: sticky;
      bottom: 0;
      z-index: 21;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 16px max(16px, var(--safe-bottom));
      background: linear-gradient(180deg, transparent, rgba(7,7,8,0.80) 18%, rgba(7,7,8,0.92));
      backdrop-filter: blur(10px);
    }
    .voice-bar-spacer{ width: 40px; flex-shrink: 0; } /* balances kbd-toggle so the mic stays visually centered */

    .hero-mic{
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 30%, rgba(0,229,255,0.35), rgba(11,61,145,0.55) 60%, rgba(7,7,8,0.9));
      box-shadow: 0 0 0 1px rgba(0,229,255,.22), 0 0 24px rgba(0,229,255,.28), 0 8px 30px rgba(0,0,0,.4);
      animation: heroMicIdle 2.6s ease-in-out infinite;
      transition: transform .15s ease;
      flex-shrink: 0;
      position: relative;
      z-index: 30;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .hero-mic:hover{ transform: scale(1.05); }
    .hero-mic:active{ transform: scale(0.96); }
    .hero-mic.listening{
      background: radial-gradient(circle at 35% 30%, rgba(74,222,128,.45), rgba(22,101,52,.55) 60%, rgba(7,7,8,0.9));
      animation: heroMicListening 1.1s ease-in-out infinite;
    }
    .hero-mic.speaking{
      opacity: .55;
      cursor: not-allowed;
      animation: none;
      box-shadow: 0 0 0 1px rgba(124,58,237,.22), 0 0 18px rgba(124,58,237,.22);
    }
    @keyframes heroMicIdle{
      0%,100%{ box-shadow: 0 0 0 1px rgba(0,229,255,.22), 0 0 20px rgba(0,229,255,.22), 0 8px 30px rgba(0,0,0,.4); }
      50%{ box-shadow: 0 0 0 1px rgba(0,229,255,.30), 0 0 36px rgba(0,229,255,.36), 0 8px 30px rgba(0,0,0,.4); }
    }
    @keyframes heroMicListening{
      0%,100%{ box-shadow: 0 0 0 1px rgba(74,222,128,.28), 0 0 22px rgba(74,222,128,.30); }
      50%{ box-shadow: 0 0 0 3px rgba(74,222,128,.36), 0 0 40px rgba(74,222,128,.44); }
    }

    .kbd-toggle{
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.75);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s ease, border-color .15s ease;
    }
    .kbd-toggle:hover{ background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.2); }
    .kbd-toggle.active{ background: rgba(0,229,255,0.14); border-color: rgba(0,229,255,0.4); color: #00E5FF; }

    .composer{
      max-width: 860px;
      margin: 0 auto;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .input-pill{
      flex:1;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.045);
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      transition: border-color .18s ease, background .18s ease;
    }
    .input-pill:focus-within{
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.055);
    }

    .icon-btn{
      width:38px;height:38px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.88);
      display:grid;
      place-items:center;
      cursor:pointer;
      flex: 0 0 auto;
      user-select:none;
    }
    .icon-btn:hover{ background: rgba(255,255,255,0.06); }

    textarea.ta{
      flex:1;
      border:none;
      outline:none;
      resize:none;
      background: transparent;
      color: rgba(255,255,255,0.92);
      font: 14px/1.35 inherit;
      min-height: 22px;
      max-height: 120px;
      padding: 4px 2px;
    }
    textarea.ta::placeholder{ color: rgba(255,255,255,0.45); }

    .send{
      width:44px;height:44px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      display:grid;place-items:center;
      cursor:pointer;
      user-select:none;
      transition: transform .12s ease, background .12s ease;
    }
    .send:hover{ background: rgba(255,255,255,0.085); }
    .send:active{ transform: scale(0.98); }

    .kbd-row{
      max-width: 860px;
      margin: 8px auto 0;
      color: rgba(255,255,255,0.38);
      font-size: 12px;
      padding: 0 10px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      user-select:none;
      align-items: center;
    }
    .kbd{
      border:1px solid rgba(255,255,255,0.10);
      border-bottom-color: rgba(0,0,0,0.7);
      background: rgba(255,255,255,0.05);
      padding: 2px 7px;
      border-radius: 8px;
    }

    /* subtle hint under composer */
    .composer-hint{
      max-width: 860px;
      margin: 6px auto 0;
      padding: 0 12px;
      font-size: 12px;
      color: rgba(255,255,255,0.42);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .18s ease, transform .18s ease;
      user-select:none;
      pointer-events:none;
      min-height: 16px;
    }
    .composer-hint.show{
      opacity: 1;
      transform: translateY(0);
    }

    /* Drawer (kept) */
    .drawer{
      position:fixed; top:58px; right:-320px; width:320px; height:calc(100% - 70px);
      background: rgba(7,7,8,0.88);
      border-left:1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      transition:right .25s ease;
      z-index: 50;
    }
    .drawer.open{ right:0 }
    .drawer .inner{ padding:14px; display:flex; flex-direction:column; gap:12px }
    .drawer h3{ margin:8px 0 6px 0; font-size:13px; opacity:.9 }
    
    /* Mobile Drawer Fullscreen Overlay Fix */
    @media (max-width: 640px) {
    .drawer {
    top: 0;
    right: -100vw;
    width: 100vw;
    height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    z-index: 1001;
    }
    .drawer.open { 
    right: 0; 
  }
}

    .list{ font-size:.92rem; opacity:.95; display:flex; flex-direction:column; gap:8px }
    .item{
      border:1px solid rgba(255,255,255,0.10);

/* ✅ Hero orb container — centers the now-dominant Orb above the feed.
   Lives outside the scrolling .feed, so it's never pushed off-screen;
   .orb-mini shrinks it once the conversation is active. */
.orb-hero {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 28px 0 10px;
  flex-shrink: 0;
  transition: padding .4s ease;
}
.orb-hero.orb-mini {
  padding: 10px 0 8px;
}
.orb-hero.orb-mini #orbShell {
  width: 56px;
  height: 56px;
}

/* Shell — CSS glow ring, driven by state classes */
#orbShell {
  position: relative;
  width: clamp(140px, 30vw, 200px);
  height: clamp(140px, 30vw, 200px);
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  z-index: 5;
  pointer-events: auto;
  touch-action: manipulation;
  transition: box-shadow .35s ease, transform .16s ease, width .4s ease, height .4s ease;
  animation: orbIdle 4s ease-in-out infinite;
}
#orbShell:hover  { transform: scale(1.03); }
#orbShell:active { transform: scale(0.98); }

#orbCanvas {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  pointer-events: none; /* clicks pass through to #orbShell, which owns the click handler */
}

/* ── State classes (set by Block 3 JS) ── */
#orbShell.s-idle {
  animation: orbIdle 4s ease-in-out infinite;
}
#orbShell.s-listening {
  animation: orbListen 1.3s ease-in-out infinite;
}
#orbShell.s-thinking {
  animation: orbThink 2.4s ease-in-out infinite;
}
#orbShell.s-responding {
  animation: orbRespond 0.88s ease-in-out infinite;
}
#orbShell.s-speaking {
  animation: orbSpeak 1.05s ease-in-out infinite;
}

/* Barge-in hint — only visible while responding or speaking */
#orbShell::after {
  content: 'tap to stop';
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: .04em;
  color: rgba(255,255,255,0.44);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
#orbShell.s-responding::after,
#orbShell.s-speaking::after { opacity: 1; }

/* ── Keyframes ── */
@keyframes orbSpeak {
  0%, 100% {
    box-shadow: 0 0 0 1px rgba(0,229,255,.20),
                0 0 26px var(--sherz-aura-1),
                0 0 14px var(--sherz-aura-2);
  }
  50% {
    box-shadow: 0 0 0 1px rgba(124,58,237,.28),
                0 0 46px var(--sherz-aura-3),
                0 0 22px var(--sherz-aura-2);
  }
}
@keyframes orbIdle {
  0%,100% {
    box-shadow: 0 0 0 1px rgba(255,255,255,.06),
                0 0 20px rgba(210,210,240,.09);
  }
  50% {
    box-shadow: 0 0 0 1px rgba(255,255,255,.11),
                0 0 38px rgba(210,210,240,.17);
  }
}
@keyframes orbListen {
  0%,100% {
    box-shadow: 0 0 0 1px rgba(74,222,128,.18),
                0 0 26px rgba(74,222,128,.20),
                0 0 54px rgba(74,222,128,.07);
  }
  50% {
    box-shadow: 0 0 0 2px rgba(74,222,128,.36),
                0 0 48px rgba(74,222,128,.34),
                0 0 90px rgba(74,222,128,.13);
  }
}
@keyframes orbThink {
  0%,100% {
    box-shadow: 0 0 0 1px rgba(59,130,246,.18),
                0 0 26px rgba(59,130,246,.20),
                0 0 54px rgba(59,130,246,.07);
  }
  50% {
    box-shadow: 0 0 0 2px rgba(59,130,246,.30),
                0 0 44px rgba(59,130,246,.26),
                0 0 82px rgba(59,130,246,.10);
  }
}
@keyframes orbRespond {
  0%,100% {
    box-shadow: 0 0 0 1px rgba(167,139,250,.20),
                0 0 30px rgba(167,139,250,.24),
                0 0 64px rgba(167,139,250,.09);

                0 0 54px rgba(167,139,250,.40),
                0 0 100px rgba(167,139,250,.16);
  }
}

    // =========================
    // Helpers

    const esc = (s)=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');

    function renderLiteMd(t){
      if(!t) return '';
      return esc(t)
        .replace(/```([\s\S]*?)```/g,(m,p)=>`<pre><code>${esc(p)}</code></pre>`)
        .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')

    // =========================
    // ✅ Typewriter core (FIX: boshida dots)
    // =========================
    async function typewriter(el, rawText, opts = {}){
      const speed = opts.speed ?? 16;
      const jitter = opts.jitter ?? 10;
      const minDelay = opts.minDelay ?? 6;
      const maxChars = opts.maxChars ?? 1200;

      const t = String(rawText || '');
      if (!el) return;

      const k = t.length > maxChars ? 6 : 1;
      const step = Math.max(1, k);

      // ✅ FIX: "bo‘sh kvadrat" o‘rniga 120ms dots
      el.innerHTML = `<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;
      await sleep(120);

      let buf = '';
      for (let i=0; i<t.length; i+=step){
        buf += t.slice(i, i+step);
        el.innerHTML = esc(buf).replace(/\n/g,'<br>');
        const d = Math.max(minDelay, speed - Math.min(8, Math.floor(i/120))) + Math.floor(Math.random()*jitter);
        await sleep(d);
      }
      el.innerHTML = renderLiteMd(t);
    }

    // =========================
    // Phase order + fallback + reveal
    // =========================
    const PHASE_ORDER = ['listen','cause','analyze','help','comfort'];

    function normalizePhaseOrder(blocks){
      if (!Array.isArray(blocks)) return blocks;
      const by = new Map();
      for (const b of blocks){
        const k = (b.type || '').toLowerCase();
        if (!by.has(k)) by.set(k, []);
        by.get(k).push(b);
      }
      const out = [];
      for (const k of PHASE_ORDER) if (by.has(k)) out.push(...by.get(k));
      for (const [k, arr] of by.entries()) if (!PHASE_ORDER.includes(k)) out.push(...arr);
      return out;
    }

    function inferPhasesFromPlainText(raw){
      const t = (raw||'').trim();
      if (!t) return null;

      const blocks = t.split(/\n\s*\n+/g).map(s=>s.trim()).filter(Boolean);
      if (blocks.length === 0) return null;

      const isHelpish = (s)=> /(^|\n)\s*([-*]|\d+\.)\s+/m.test(s) || /(qadam|step|try|qil|qiling|boshlang|maslahat|yo'l)/i.test(s);
      const isCauseish = (s)=> /(chunki|sabab|negaki|because|due to|shuning uchun)/i.test(s);
      const isAnalyzeish= (s)=> /(tahlil|demak|xulosa|natija|ko'rinadiki|likely|ehtimol)/i.test(s);
      const isComfortish= (s)=> /(uddalaysan|ishonaman|xavotir olma|normal|o'zingni qiynama|hammasi yaxshi|sen qila olasan)/i.test(s);
      const isListenish = (s)=> /(tushundim|eshityapman|his qilyapsan|og'ir|charchagan|xafa|stress|havotir)/i.test(s);

      const used = new Array(blocks.length).fill(false);
      const out = [];

      let li = blocks.findIndex(isListenish);
      if (li === -1) li = 0;
      out.push({ type:'listen', content: blocks[li] });
      used[li] = true;

      let ci = -1;
      for (let i=blocks.length-1;i>=0;i--){
        if (used[i]) continue;
        if (isComfortish(blocks[i])) { ci=i; break; }
      }
      if (ci === -1){
        for (let i=blocks.length-1;i>=0;i--) if (!used[i]) { ci=i; break; }
      }
      if (ci !== -1){ out.push({ type:'comfort', content: blocks[ci] }); used[ci]=true; }

      for (let i=0;i<blocks.length;i++){
        if (used[i]) continue;
        const s = blocks[i];
        let type = 'analyze';
        if (isHelpish(s)) type = 'help';
        else if (isCauseish(s)) type = 'cause';
        else if (isAnalyzeish(s)) type = 'analyze';
        out.push({ type, content: s });
      }
      return normalizePhaseOrder(out);
    }

    function parsePhases(raw){
      const text = (raw||'').trim();
      if (!text) return null;

      const lines = text.split('\n');
      const map = { LISTEN:'listen', CAUSE:'cause', ANALYZE:'analyze', HELP:'help', COMFORT:'comfort' };

      let current = null;
      const blocks = [];

      function pushCurrent(){
        if (current && current.content.trim()){
          blocks.push({ type: current.type, content: current.content.trim() });
        }
      }

      for (const ln of lines){
        const m = ln.match(/^\s*(LISTEN|CAUSE|ANALYZE|HELP|COMFORT)\s*:\s*(.*)\s*$/i);
        if (m){
          pushCurrent();
          const key = m[1].toUpperCase();
          current = { type: map[key], content: m[2] ? m[2] + '\n' : '' };
        } else if (current){
          current.content += ln + '\n';
        }
      }
      pushCurrent();

      if (blocks.length >= 2) return normalizePhaseOrder(blocks);
      return null;
    }

    function renderPhaseBlocks(blocks){
      const title = { listen:'LISTENING', cause:'CAUSE', analyze:'ANALYZE', help:'HELP', comfort:'COMFORT' };
      const wid = 'pw_' + Math.random().toString(16).slice(2);

      const items = blocks.map(b => ({
        type: b.type,
        text: b.content,
        html: `
          <div class="phase ${b.type}">
            <div class="phase-h">
              <span class="phase-dot"></span>
              <span>${title[b.type] || String(b.type).toUpperCase()}</span>
            </div>
            <div class="phase-b"></div>
          </div>
        `.trim()
      }));

      return { wid, items, html: `<div id="${wid}" class="phase-wrap"></div>` };
    }

    async function runRevealLoopFor(phaseWrap){
      if (!phaseWrap) return;
      if (phaseWrap._running) return;
      phaseWrap._running = true;

      while (phaseWrap._queue && phaseWrap._queue.length){
        const next = phaseWrap._queue.shift();
        phaseWrap.insertAdjacentHTML('beforeend', next.html);

        const last = phaseWrap.lastElementChild;
        if (last && last.classList && last.classList.contains('phase')){
          requestAnimationFrame(()=> last.classList.add('enter'));
          const body = last.querySelector('.phase-b');
          await typewriter(body, next.text, { speed: 14, jitter: 12, maxChars: 900 });
        }

        feed.scrollTop = feed.scrollHeight;
        await sleep(120);
      }

      phaseWrap._running = false;
    }

    function enqueuePhases(phaseWrap, items){
      if (!phaseWrap) return;
      phaseWrap._queue = (phaseWrap._queue || []).concat(items);
      runRevealLoopFor(phaseWrap);
    }

    // AI bubble (typewriter) + ✅ stable width
    async function addAiTypewriter(text, opts = {}){
      const wrap = document.createElement('div');

      if (phases){
        wrap.removeChild(content);

        const pack = renderPhaseBlocks(phases);
        const holder = document.createElement('div');
        holder.innerHTML = pack.html;
        wrap.insertBefore(holder.firstChild, time);

        const phaseWrap = document.getElementById(pack.wid);
        enqueuePhases(phaseWrap, pack.items);

      }

      await typewriter(content, text, { speed: 11, jitter: 8, minDelay: 4, maxChars: 900 });

      if (opts.suggestions && Array.isArray(opts.suggestions) && opts.suggestions.length){

    // =========================
    // ✅ Intro (ODAMIY) + ✅ Chips (TABIIY)

    // =========================
    // ✅ TTS playback (hands-free Step 1)
    // =========================
    let ttsAudio = null;
    let ttsGen = 0; // generation counter — invalidates stale onended/onerror callbacks
                     // from a previous turn (Safari can fire 'ended' after a manual
                     // pause()/src swap, so we can't trust the event alone)

    // ✅ Shared Web Audio graph for the speaking-aura visualizer. One AudioContext
    // is reused across turns (browsers cap how many you can create); a fresh
    // MediaElementSourceNode is made per <audio> since a source node can only
    // ever attach to one element.
    let ttsAudioCtx = null;
    function getTTSAnalyser(audio){
      if (!ttsAudioCtx) ttsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (ttsAudioCtx.state === 'suspended') ttsAudioCtx.resume();
      const analyser = ttsAudioCtx.createAnalyser();
      analyser.fftSize = 128;
      const src = ttsAudioCtx.createMediaElementSource(audio);
      src.connect(analyser);
      analyser.connect(ttsAudioCtx.destination); // keep audible — analyser is a pass-through tap
      return analyser;
    }

    function stopTTS(){
      ttsGen++; // any in-flight fetch or pending onended from the old audio is now stale
      if (ttsAudio){
        try{
          ttsAudio.onended = null;
          ttsAudio.onerror = null;
          ttsAudio.pause();
          ttsAudio.currentTime = 0;
        }catch(e){}
        ttsAudio = null;
      }
      window.__orbAnalyser = null;
      $('heroMic')?.classList.remove('speaking');
    }
    // ✅ Public API — lets callers (barge-in, mic click, orb click) cleanly
    // interrupt playback without risking a duplicate startListening() call
    window.__ttsStop = stopTTS;

    async function playTTS(text){
      const q = (text || '').trim();
      if (!q) return;

      stopTTS(); // interrupt any still-playing/in-flight turn before starting this one
      // ✅ Mute the mic while SHERZ speaks — prevents the recognizer from hearing
      // (and re-transcribing) our own TTS output
      if (window.stopListening) window.stopListening();
      const myGen = ttsGen;

      let objectUrl = null;
      try{
        const r = await fetch(apiUrl('/api/tts'), {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ text: q })
        });
        if (!r.ok) throw new Error(`TTS HTTP ${r.status}`);

        const blob = await r.blob();
        if (myGen !== ttsGen) return; // superseded while fetching — drop silently

        objectUrl = URL.createObjectURL(blob);
        const audio = new Audio(objectUrl);
        ttsAudio = audio;

        // Tap the audio for the SHERZ-branded aura visualizer. If this fails
        // (older Safari, autoplay-policy edge cases) playback still proceeds —
        // the orb just falls back to its non-reactive speaking pulse.
        try{
          window.__orbAnalyser = getTTSAnalyser(audio);
        }catch(e){
          console.warn('[orb] audio-reactive aura unavailable:', e.message);
        }
        if (window.__orbSetState) window.__orbSetState('speaking');
        $('heroMic')?.classList.add('speaking');

        let fired = false; // belt-and-suspenders: guards against onended firing twice
        const finish = () => {
          if (fired) return;
          fired = true;
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          // only advance to listening if nothing has interrupted/superseded us since
          if (myGen === ttsGen && ttsAudio === audio){
            ttsAudio = null;
            window.__orbAnalyser = null;
            if (lastTurnSource === 'voice'){
              if (window.startListening) window.startListening();
            } else {
              setStatus('idle');
              if (window.__orbSetState) window.__orbSetState('idle');
            }
          }
        };

        audio.onended = finish;
        audio.onerror = () => { addError('TTS ijro xatosi'); finish(); };

        await audio.play();

      }catch(e){
        if (myGen === ttsGen){
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          addError(`TTS xatosi: ${e.message}`);
          ttsAudio = null;
          window.__orbAnalyser = null;
          // don't let a TTS failure stall hands-free mode for voice turns —
          // fall through to listening only if this was a voice-initiated turn
          if (lastTurnSource === 'voice'){
            if (window.startListening) window.startListening();
          } else {
            setStatus('idle');
            if (window.__orbSetState) window.__orbSetState('idle');
          }
        }
      }
    }

    // =========================
    // ✅ Send pipeline (server)
    // =========================
    async function sendToServer(text, source){
      const q = (text||'').trim();
      if (!q) return;
      lastTurnSource = (source === 'voice') ? 'voice' : 'text';

      try{
        setStatus('thinking');
        showTyping();

        const r = await fetch(apiUrl('/api/chat-stream'), {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            message: q,
            userId: ($('uid')?.value || 'u1'),
            ui: { tone:'normal', lang:'uz' }
          })
        });

        if (!r.ok || !r.body){
          // Stream endpoint unavailable — fall back to the old blocking path
          // rather than failing the whole turn.
          console.warn('[chat-stream] unavailable, falling back to /api/chat:', r.status);
          return await sendToServerFallback(q);
        }

        // ✅ Live SSE consumption — the AI bubble is created up front and

      let sum = 0;
      for (let i = 0; i < fftBuf.length; i++) sum += fftBuf[i];
      audioLevel = Math.min(1, (sum / fftBuf.length) / 78);
    }

    // Color target: flat state color, or — for 'speaking' — a fluid cycle
    // through the SHERZ brand hues, which speeds up as the voice gets louder
    let targetRGB = cfg.rgb;
    if (cfg.brand) {
      auraPhase += 0.006 + audioLevel * 0.02;
      const cyc = (Math.sin(auraPhase) + 1) / 2; // 0..1
      targetRGB = cyc < 0.5
        ? lerpRGB(AURA_1, AURA_2, cyc * 2)
        : lerpRGB(AURA_2, AURA_3, (cyc - 0.5) * 2);
    }
    lerpC = lerpRGB(lerpC, targetRGB, 0.055);
    const C = lerpC;

    const pulse    = 0.5 + 0.5 * Math.sin(t * cfg.hz * 0.08);
    const boostAmp = audioLevel > 0 ? audioLevel : pulse;
    const scale    = 1 + 0.052 * pulse + 0.038 * audioLevel;

    // 1. Tashqi neon nurlar (Glow Rings)
    for (let i = cfg.rings; i >= 1; i--) {
      const rr    = R * scale * (1 + i * 0.16);
      const alpha = cfg.ringA * (1 - (i - 1) * 0.38) * (0.5 + 0.5 * pulse);
      const gr    = ctx.createRadialGradient(CX, CY, rr * 0.55, CX, CY, rr);
      gr.addColorStop(0, rgba(C, alpha * 0.55));
      gr.addColorStop(1, rgba(C, 0));
      ctx.beginPath();
      ctx.arc(CX, CY, rr, 0, Math.PI * 2);
      ctx.fillStyle = gr;
      ctx.fill();
    }

    // 2. Markaziy kiber-yadro (Core Disc)
    const disc = ctx.createRadialGradient(CX - R*.22, CY - R*.22, R*.04, CX, CY, R * scale);
    disc.addColorStop(0,    rgba(C, 0.65)); // Logotip ko'rinishi uchun biroz shaffof qildik
    disc.addColorStop(0.42, rgba(C, 0.30));
    disc.addColorStop(1,    rgba(C, 0.02));
    ctx.beginPath();
    ctx.arc(CX, CY, R * scale, 0, Math.PI * 2);
    ctx.fillStyle = disc;
    ctx.fill();

    // 3. Matematik qutb to'lqinlari (Polar Wave)
    const wAmp = cfg.waveAmp + boostAmp * 6.5;
    ctx.beginPath();
    for (let i = 0; i <= 90; i++) {
      const ang      = (i / 90) * Math.PI * 2;
      let   fftBoost = 0;
      if (fftBuf) {
        const bin = Math.floor((i / 90) * (fftBuf.length * 0.5));
        fftBoost  = (fftBuf[bin] || 0) / 255 * 5.5;
      }
      const r2 = R * scale * (1 + (wAmp + fftBoost) / R * Math.sin(ang * cfg.waveFreq + t * 0.056));
      const x  = CX + r2 * Math.cos(ang);
      const y  = CY + r2 * Math.sin(ang);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = rgba(C, 0.35 + 0.15 * pulse);
    ctx.lineWidth   = 1.5;
    ctx.stroke();

 // 4. 🔥 SHERZ ICON INTEGRATSIYASI (Tirik tebranuvchi logotip)
    if (logoImg.complete && logoImg.naturalWidth !== 0) {
      ctx.save();
      const logoSize = (R * 2.42) * scale + (audioLevel * R * 0.56); // R-relative, was hardcoded for the old 92px canvas
      ctx.globalAlpha = 0.55 + 0.25 * pulse + (audioLevel * 0.2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(logoImg, CX - logoSize / 2, CY - logoSize / 2, logoSize, logoSize);
      ctx.restore();
    } else {
    // ✅ Fallback: guaranteed "S" mark, styled to match orb glow/branding
    ctx.save();
    const fontSize = Math.round(R * scale * 0.85);
    ctx.font = `800 ${fontSize}px -apple-system, system-ui, 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    // Precise vertical centering via actual glyph metrics
    const metrics = ctx.measureText('S');
    const ascent  = metrics.actualBoundingBoxAscent  || fontSize * 0.72;
    const descent = metrics.actualBoundingBoxDescent || 0;
    const baselineY = CY + (ascent - descent) / 2;

    // Glow matches the orb's current state color (green/blue/purple)
    ctx.shadowColor = rgba(C, 0.85);
    ctx.shadowBlur = 14 + pulse * 6;
    ctx.fillStyle = rgba([255,255,255], 0.92 + 0.08 * pulse);
    ctx.fillText('S', CX, baselineY);

    ctx.restore();
    }

    // 5. Yorqin effekt (Specular Highlight)
    const spec = ctx.createRadialGradient(CX - R*.30, CY - R*.30, 0, CX - R*.30, CY - R*.30, R * 0.54);
    spec.addColorStop(0, rgba([255,255,255], 0.22 + 0.08 * pulse));
    spec.addColorStop(1, rgba([255,255,255], 0));
    ctx.beginPath();
    ctx.arc(CX, CY, R * scale, 0, Math.PI * 2);
    ctx.fillStyle = spec;
    ctx.fill();

    t++;
    requestAnimationFrame(draw);
  }

  draw();

  window.__orbSetState = function(newState) {
    state = STATES[newState] ? newState : 'idle';
    shell.className = 's-' + state;
  };

shell.addEventListener('click', () => {
  if (window.__ttsStop) window.__ttsStop();
  if (window.__micToggle) window.__micToggle();
  else if (window.startListening) window.startListening(true); // fallback if setupMic hasn't wired up yet
});

  if (typeof setStatus === 'function') {
    const _orig = setStatus;
    window.setStatus = function(mode) {
      _orig(mode);
      window.__orbSetState(mode || 'idle');
    };
  } else {
    const poll = setInterval(() => {
      if (typeof setStatus === 'function') {
        const _orig = setStatus;
        window.setStatus = function(mode) {
          _orig(mode);
          window.__orbSetState(mode || 'idle');
        };
        clearInterval(poll);
      }
    }, 80);
  }
})();
</script>

<!-- ✅ MOBILE PLATFORM LAYER — detection + keyboard viewport handling -->
<script>
(function setupMobilePlatform(){
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /Android/.test(ua);

  if (isIOS) document.documentElement.classList.add('platform-ios');
  if (isAndroid) document.documentElement.classList.add('platform-android');

  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  const appEl = document.querySelector('.app');

  function scrollFeedToBottom(){
    const feed = document.querySelector('.feed');
    if (feed) requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });
  }

  function onViewportResize(){
    if (isIOS && appEl) {
      appEl.style.height = vv.height + 'px';
      appEl.style.transform = `translateY(${vv.offsetTop}px)`;
    } else if (isAndroid) {
      const kbHeight = Math.max(0, window.innerHeight - vv.height);
      document.documentElement.style.setProperty('--kb-offset', kbHeight + 'px');
    }
    scrollFeedToBottom();
  }

  vv.addEventListener('resize', onViewportResize);
  vv.addEventListener('scroll', onViewportResize);
  onViewportResize();

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      if (appEl) { appEl.style.height = '100dvh'; appEl.style.transform = ''; }
      scrollFeedToBottom();
    }, 150);
  });
})();
</script>
