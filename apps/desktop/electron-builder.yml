# Builds the installers:  npm run desktop:build   (from the apps folder)
appId: ai.sherz.app
productName: SHERZ
copyright: SHERZ AI
directories: { output: dist, buildResources: build }
files: [ "src/**/*", "package.json" ]
extraResources:
  - { from: "../www", to: "www" }          # the web app (made by `npm run sync`)
protocols: [ { name: SHERZ, schemes: [ sherz ] } ]    # sherz://  → used to come back from Google sign-in
win:
  target: [ { target: nsis, arch: [ x64 ] } ]
  icon: build/icon.png
  artifactName: SHERZ-Setup-${version}.${ext}        # → dist/SHERZ-Setup-0.1.0.exe
nsis:
  oneClick: false
  perMachine: false                                  # installs for the current user only: no admin prompt, and updates install silently
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SHERZ
  deleteAppDataOnUninstall: false                    # uninstalling keeps your settings
mac:
  category: public.app-category.productivity
  target: [ { target: dmg, arch: [ x64, arm64 ] } ]
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: SHERZ uses the microphone so you can talk to it.
linux:
  target: [ AppImage ]
  category: Utility
  icon: build/icon.png
# Auto-update: the installed app looks at the newest GitHub Release of this repository (needs a PUBLIC repo or release repo; see apps/README).
publish:
  provider: github
  owner: sherzodovich63
  repo: sherz-ai
  releaseType: release
